# Reproduces the thesis benchmark: scripted 8-turn users x 3 system-prompt conditions.
name: multi_turn_thesis
approach: multi_turn
topics: data/topics/sel_topics.json
conditions: [unprompted, sycophantic, contrarian]
target:
  model: openai/gpt-5.2
  temperature: 0.0
  max_tokens: 1500
judge:
  model: google/gemini-2.5-flash
  temperature: 0.0
  max_tokens: 3500
  roles: [assistant]
concurrency: 4
params:
  scripts: data/scripts/new_data_8_turns_openai_gpt-5.2.json
