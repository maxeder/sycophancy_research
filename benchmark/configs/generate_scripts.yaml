# `syco generate`: LLM-written user scripts (turn 0 = neutral baseline question + n_turns stance messages).
name: scripts_8_turns_gpt-5.2
topics: data/topics/sel_topics.json
model:
  model: openai/gpt-5.2
  temperature: 1.0
  max_tokens: 500
attributions: [self]     # any of: self, expert, consensus, authority
stances: [pro, con]
n_reps: 20
n_turns: 8
out: data/scripts/{name}.jsonl
