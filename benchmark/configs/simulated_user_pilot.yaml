# Pilot of simulated_user.yaml: all 5 topics, pro and con, one rep, unprompted and sycophantic only.
name: simulated_user_pilot
approach: simulated_user
topics: data/topics/sel_topics.json
conditions: [unprompted, sycophantic]
target:
  model: openai/gpt-5.2
  temperature: 0.0
  max_tokens: 1500
judge:
  model: google/gemini-2.5-flash
  roles: [assistant, user]
concurrency: 4
params:
  user_model:
    model: openai/gpt-5.2
    temperature: 1.0
    max_tokens: 500
  stances: [pro, con]
  n_reps: 1
  baseline_turn: true   # turn 0 = same neutral question as the multi-turn scripts
