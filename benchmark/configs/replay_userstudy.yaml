# Send the recorded user-study messages to a new target model under the recorded condition.
# Swap target.model to compare models on real user turns.
name: replay_userstudy
approach: replay
topics: data/topics/sel_topics.json
conditions: [unprompted, sycophantic, contrarian]
target:
  model: openai/gpt-5.2
  temperature: 0.0
  max_tokens: 1500
judge:
  model: google/gemini-2.5-flash
  roles: [assistant]
concurrency: 4
params:
  adapter: user_study
  source: ../user-study/analysis/all_chats.json
  use_source_condition: true
